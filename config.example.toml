[app]
db_path = "data/xoctopus.sqlite3"
raw_dir = "data/raw"
log_dir = "data/logs"
log_level = "INFO"

[browser]
# Keep false for first login and troubleshooting. After login is stable,
# Settings -> Browser collection can switch this to true for silent collection.
headless = false
user_data_dir = "data/browser-profile"
# Use system Chrome/Chromium when Playwright bundled Chromium is unavailable.
# Examples:
# channel = "chrome"
# executable_path = "/usr/bin/google-chrome"
channel = ""
executable_path = ""
slow_mo_ms = 0
navigation_timeout_ms = 60000

[auth]
# profile reuses data/browser-profile. cookies loads a Playwright JSON cookie file.
mode = "profile"
cookies_file = "data/cookies/x.cookies.json"
cookies_format = "playwright"
refresh_cookies = true

# Optional multi-account setup. When omitted, xOctopus creates a default account
# from [auth]. Sources can bind to an account by setting account = "name".
# [[accounts]]
# name = "main"
# auth_mode = "cookies"
# cookies_file = "data/accounts/main.cookies.json"
# cookies_format = "playwright"
# refresh_cookies = true
#
# [[accounts]]
# name = "research"
# auth_mode = "cookies"
# cookies_file = "data/accounts/research.cookies.json"
# cookies_format = "playwright"
# refresh_cookies = true

[rate_limit]
page_delay_min_seconds = 20
page_delay_max_seconds = 90
scroll_delay_min_seconds = 3
scroll_delay_max_seconds = 8
max_pages_per_run = 20
pause_on_429 = true

[health]
# Session health and backoff: record account/source health, back off after
# limits or repeated failures, and require manual recovery for auth/challenge states.
enabled = true
pause_on_auth_required = true
pause_on_challenge = true
pause_on_account_warning = true
backoff_on_rate_limit_seconds = 3600
backoff_on_no_data_seconds = 900
max_consecutive_failures = 3
failure_backoff_seconds = 1800

[media]
enabled = false
download_images = false
download_videos = false
downloader = "gallery-dl"
cookies_file = ""

[[sources]]
name = "openai_timeline"
type = "user_timeline"
value = "OpenAI"
enabled = true
poll_interval_seconds = 1800
# account = "main"
