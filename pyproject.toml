[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xoctopus"
version = "0.3.0"
description = "Lightweight X Web content collector focused on post data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "xOctopus contributors" }
]
dependencies = [
  "playwright>=1.44",
  "typer>=0.12",
  "rich>=13.7",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
media = [
  "gallery-dl>=1.27",
  "yt-dlp>=2024.8.6",
]
web = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]
[project.scripts]
xoctopus = "xoctopus.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["xoctopus"]
